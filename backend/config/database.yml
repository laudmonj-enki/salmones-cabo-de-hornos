
# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
#
# On Windows:
#   Install PostgreSQL and put its /bin directory on your PATH.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: salmones_cabo_hornos_development
  username: sch_app
  password: <%= ENV.fetch("SCH_DATABASE_PASSWORD") %>
  host: localhost
  port: 5432

test:
  <<: *default
  database: salmones_cabo_hornos_test
  username: sch_app
  password: <%= ENV.fetch("SCH_DATABASE_PASSWORD") %>
  host: localhost
  port: 5432

# Production configuration.
# Configure production credentials before deployment.
production:
  primary: &primary_production
    <<: *default
    database: backend_production
    username: backend
    password: <%= ENV["BACKEND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: backend_production_cable
    migrations_paths: db/cable_migrate
